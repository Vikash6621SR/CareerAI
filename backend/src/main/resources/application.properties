spring.application.name=career-ai-backend

server.port=${PORT:8080}


# ==========================================================
# DATABASE
# ==========================================================

spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/career_ai?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}

spring.datasource.username=${DATABASE_USERNAME:root}

spring.datasource.password=${DATABASE_PASSWORD:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ==========================================================
# JPA
# ==========================================================

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

spring.jpa.open-in-view=false

spring.jpa.show-sql=false

spring.jpa.properties.hibernate.format_sql=true


# ==========================================================
# FILE UPLOAD
# ==========================================================

spring.servlet.multipart.max-file-size=10MB

spring.servlet.multipart.max-request-size=10MB


# ==========================================================
# JWT
# ==========================================================

app.jwt.secret=${JWT_SECRET:CareerAIDevelopmentSecretKeyChangeThis123456789}

app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}


# ==========================================================
# AI
# ==========================================================

app.ai.base-url=${AI_BASE_URL:https://api.openai.com/v1}

app.ai.api-key=${AI_API_KEY:}

app.ai.model=${AI_MODEL:gpt-4o-mini}